name: CarePolicyGuard Enterprise CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Lint Check
        run: |
          ruff check app/core app/schemas --ignore E501

  test-and-coverage:
    name: Unit, Integration & Fuzz Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        env:
          SECRET_KEY: "ci-pipeline-deterministic-testing-key-84910284"
          DATABASE_URL: "sqlite:///./test_ci.db"
          ABSTENTION_THRESHOLD: "0.85"
        run: |
          pytest -v --cov=app --cov-report=term --durations=10

  docker-build-and-health:
    name: Docker Build & Health Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-and-coverage]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: carepolicyguard:latest
          load: true

      # Multi-worker startup race audit & root cause documentation: see docs/ci_docker_health_audit.md
      # Verified Green Run: https://github.com/Sumitkc74/CarePolicyGuard/actions/runs/42437902651 (commit 6cdbec5)
      # Fix: startup_db_lock() in app/main.py eliminates multi-worker SQLite table creation collisions
      - name: Execute Container Self-Health, .git Exclusion, and Synthetic Adjudication Smoke Test
        run: |
          # 1. Assert .git repository metadata was excluded from container image
          docker run --rm carepolicyguard:latest sh -c "test ! -d /app/.git" && echo "PASS: .git directory successfully excluded from container image"

          # 2. Launch container with ephemeral test credentials
          docker run -d --name cpg-test-container -p 8000:8000 \
            -e SECRET_KEY="ci-healthcheck-secret-key-3918401928" \
            -e DATABASE_URL="sqlite:///./data/ci.db" \
            -e ABSTENTION_THRESHOLD=0.85 \
            carepolicyguard:latest

          # 3. Microservice health endpoint verification with startup polling
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "PASS: Container healthcheck responding"
              break
            fi
            echo "Waiting for container startup (attempt $i/30)..."
            sleep 1
          done

          # Verify health status and print logs if failed
          curl -f http://localhost:8000/health || (docker logs cpg-test-container && exit 1)

          # 4. Synthetic clinical adjudication smoke test (zero patient data)
          curl -f -X POST http://localhost:8000/api/v1/adjudicate \
            -H "Content-Type: application/json" \
            -d '{"patient_id":"PT-SMOKE-01","policy_id":"NCD-20.4","ehr_narrative":"67yo male with ischemic cardiomyopathy s/p CABG 14 months ago. NYHA Class II symptoms on GDMT for 6 months. TTE confirms LVEF 28%."}' || (docker logs cpg-test-container && exit 1)

          # 5. Stop and clean up container
          docker stop cpg-test-container
