name: CarePolicyGuard Enterprise CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-security-audit:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pyotp

      - name: Run Test Suite
        env:
          SECRET_KEY: "ci-pipeline-deterministic-testing-key-84910284"
          DATABASE_URL: "sqlite:///./test_ci.db"
          ABSTENTION_THRESHOLD: "0.85"
        run: |
          pytest -v --durations=10

  docker-build-and-health:
    name: Docker Multi-Stage Build & HIPAA Audit
    runs-on: ubuntu-latest
    needs: test-and-security-audit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: carepolicyguard:latest
          load: true

      - name: Validate Non-Root HIPAA User
        run: |
          USER_ID=$(docker run --rm --entrypoint id carepolicyguard:latest -u)
          echo "Container running as UID: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "ERROR: Container is running as root (UID 0). Violates HIPAA Security Rule."
            exit 1
          fi
          echo "Verified: Container runs as unprivileged UID $USER_ID"

      - name: Execute Container Self-Health Test
        run: |
          docker run -d --name cpg-test-container -p 8000:8000 \
            -e SECRET_KEY="ci-healthcheck-secret-key-3918401928" \
            -e DATABASE_URL="sqlite:///./data/ci.db" \
            carepolicyguard:latest
          sleep 5
          docker inspect --format='{{json .State.Health.Status}}' cpg-test-container || curl -f http://localhost:8000/health
          docker stop cpg-test-container

